<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NV Games Arcade</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#eef6ff;font-family:Arial,sans-serif;text-align:center}
header{padding:22px 10px;background:#101e32}
h1{color:#36e0d0;margin:8px}
header p{color:#9eb2ca}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px;max-width:850px;margin:auto}
.game{padding:17px 8px;border:1px solid #35506f;border-radius:15px;background:#14243b;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.game span{display:block;font-size:30px;margin-bottom:8px}
.game.active{border:2px solid #36e0d0}
#area{max-width:520px;margin:10px auto;padding:12px}
#title{color:#36e0d0}
canvas{width:100%;height:auto;background:#07101c;border:1px solid #35506f;border-radius:12px;touch-action:none}
button{touch-action:manipulation}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px}
.controls button,#start{padding:13px 19px;border:0;border-radius:10px;background:#36e0d0;color:#07111f;font-size:18px;font-weight:bold}
#start{font-size:16px;margin:8px}
#message{color:#ffd166;min-height:24px}
footer{padding:20px;color:#9eb2ca}
</style>
</head>
<body>
<header>
<h1>🎮 NV GAMES ARCADE</h1>
<p>Choose a game and beat your best score!</p>
</header>

<div class="games">
<button class="game active" data-game="snake"><span>🐍</span>Snake</button>
<button class="game" data-game="shoot"><span>🚀</span>Space Shooter</button>
<button class="game" data-game="runner"><span>🏃</span>City Runner</button>
<button class="game" data-game="car"><span>🏎️</span>Car Racing</button>
</div>

<section id="area">
<h2 id="title">🐍 Snake</h2>
<p id="score">Score: 0</p>
<canvas id="game" width="360" height="480"></canvas>
<div id="message">Press Start Game to play!</div>
<button id="start">▶ Start Game</button>
<div class="controls">
<button onclick="act('left')">◀</button>
<button onclick="act('up')">▲</button>
<button onclick="act('down')">▼</button>
<button onclick="act('right')">▶</button>
<button id="fire" onclick="act('fire')" hidden>FIRE 🔥</button>
</div>
<p id="help">Collect food and avoid walls.</p>
</section>
<footer>NV Games • Play for fun</footer>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
const scoreText=document.getElementById("score");
const message=document.getElementById("message");
const title=document.getElementById("title");
const help=document.getElementById("help");
const fire=document.getElementById("fire");
const startBtn=document.getElementById("start");

let mode="snake",running=false,score=0,timer=null;
let snake,food,dir,player,objects,frame,road;

const descriptions={
snake:"Use arrows to eat the yellow food. Avoid the walls and yourself.",
shoot:"Move left or right and press FIRE to shoot the targets.",
runner:"Change lanes to dodge barriers. Up jumps; down slides.",
car:"Move left or right to avoid traffic and survive."
};

function reset(){
 running=false;
 clearInterval(timer);
 score=0;
 frame=0;
 road=0;
 objects=[];
 dir={x:20,y:0};
 snake=[{x:160,y:220},{x:140,y:220},{x:120,y:220}];
 food={x:260,y:220};
 player={lane:1,y:405};
 scoreText.textContent="Score: 0";
 message.textContent="Press Start Game to play!";
 startBtn.hidden=false;
 fire.hidden=mode!=="shoot";
 help.textContent=descriptions[mode];
 title.textContent={
 snake:"🐍 Snake",
 shoot:"🚀 Space Shooter",
 runner:"🏃 City Runner",
 car:"🏎️ Car Racing"
 }[mode];
 draw();
}

document.querySelectorAll(".game").forEach(btn=>{
 btn.addEventListener("click",()=>{
  document.querySelectorAll(".game").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  mode=btn.dataset.game;
  reset();
 });
});

startBtn.onclick=()=>{
 if(running)return;
 reset();
 running=true;
 startBtn.hidden=true;
 message.textContent="Game on!";
 timer=setInterval(update,100);
};

function act(a){
 if(mode==="snake"){
  const dirs={left:{x:-20,y:0},right:{x:20,y:0},up:{x:0,y:-20},down:{x:0,y:20}};
  const d=dirs[a];
  if(d&&!(d.x===-dir.x&&d.y===-dir.y))dir=d;
 }else if(mode==="shoot"){
  if(a==="left")player.x=Math.max(20,(player.x||180)-22);
  if(a==="right")player.x=Math.min(340,(player.x||180)+22);
  if(a==="fire"&&running)objects.push({x:player.x||180,y:410,type:"bullet"});
 }else{
  if(a==="left")player.lane=Math.max(0,player.lane-1);
  if(a==="right")player.lane=Math.min(2,player.lane+1);
  if(mode==="runner"&&a==="up")player.jump=10;
  if(mode==="runner"&&a==="down")player.slide=5;
 }
 draw();
}

window.addEventListener("keydown",e=>{
 const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"," ":"fire"};
 if(map[e.key]){e.preventDefault();act(map[e.key]);}
});

function end(msg){
 running=false;
 clearInterval(timer);
 startBtn.hidden=false;
 startBtn.textContent="↻ Play Again";
 message.textContent=msg+" Final score: "+score;
}

function addScore(n=1){
 score+=n;
 scoreText.textContent="Score: "+score;
}

function update(){
 frame++;
 if(mode==="snake"){
  if(frame%2===0){
   let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
   if(h.x<0||h.x>=360||h.y<0||h.y>=480||
      snake.some(p=>p.x===h.x&&p.y===h.y)){
    end("Game over!");return;
   }
   snake.unshift(h);
   if(h.x===food.x&&h.y===food.y){
    addScore(10);
    food={x:Math.floor(Math.random()*18)*20,
          y:Math.floor(Math.random()*24)*20};
   }else snake.pop();
  }
 }else if(mode==="shoot"){
  if(frame%10===0)objects.push({
   x:20+Math.random()*320,y:-10,type:"enemy"
  });
  objects.forEach(o=>o.y+=o.type==="bullet"?-8:3);
  for(let i=objects.length-1;i>=0;i--){
   let o=objects[i];
   if(o.type==="enemy"&&o.y>395&&Math.abs(o.x-(player.x||180))<24){
    end("Your ship was hit!");return;
   }
   if(o.type==="bullet"){
    let j=objects.findIndex(e=>e.type==="enemy"&&Math.abs(e.x-o.x)<18&&Math.abs(e.y-o.y)<18);
    if(j>=0){objects.splice(Math.max(i,j),1);addScore(10);continue;}
   }
   if(o.y>490||o.y<-20)objects.splice(i,1);
   else if(o.type==="enemy"&&o.y>480){objects.splice(i,1);addScore(1);}
  }
 }else{
  road=(road+5)%60;
  if(frame%12===0)objects.push({
   lane:Math.floor(Math.random()*3),y:-35,
   type:"enemy"
  });
  objects.forEach(o=>o.y+=5);
  for(let i=objects.length-1;i>=0;i--){
   let o=objects[i];
   if(o.y>player.y-25&&o.y<player.y+35&&o.lane===player.lane){
    if(mode==="runner"&&(player.jump>0||player.slide>0))continue;
    end("Crash! Try again.");return;
   }
   if(o.y>500){objects.splice(i,1);addScore();}
  }
  if(player.jump>0)player.jump--;
  if(player.slide>0)player.slide--;
 }
 draw();
}

function draw(){
 ctx.clearRect(0,0,360,480);
 ctx.fillStyle="#07101c";
 ctx.fillRect(0,0,360,480);

 if(mode==="snake"){
  ctx.strokeStyle="#142b3c";
  for(let x=0;x<360;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,480);ctx.stroke();}
  for(let y=0;y<480;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(360,y);ctx.stroke();}
  ctx.fillStyle="#ffd166";ctx.fillRect(food.x+3,food.y+3,14,14);
  snake.forEach((p,i)=>{
   ctx.fillStyle=i===0?"#7cffcf":"#28bcae";
   ctx.fillRect(p.x+2,p.y+2,16,16);
  });
 }

 if(mode==="shoot"){
  ctx.fillStyle="#9dbce8";
  for(let i=0;i<35;i++){
   ctx.fillRect((i*47)%360,(i*83+frame*2)%480,2,2);
  }
  objects.forEach(o=>{
   ctx.fillStyle=o.type==="bullet"?"#ffd166":"#ff5577";
   ctx.beginPath();ctx.arc(o.x,o.y,o.type==="bullet"?4:12,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle="#36e0d0";
  ctx.beginPath();
  ctx.moveTo((player.x||180),395);
  ctx.lineTo((player.x||180)+22,430);
  ctx.lineTo((player.x||180),423);
  ctx.lineTo((player.x||180)-22,430);
  ctx.fill();
 }

 if(mode==="runner"||mode==="car"){
  ctx.fillStyle="#26344b";ctx.fillRect(45,0,270,480);
  ctx.strokeStyle="#d1d9e5";
  ctx.setLineDash([20,20]);
  ctx.lineDashOffset=-road;
  ctx.beginPath();ctx.moveTo(135,0);ctx.lineTo(135,480);
  ctx.moveTo(225,0);ctx.lineTo(225,480);ctx.stroke();
  ctx.setLineDash([]);
  objects.forEach(o=>{
   let x=90+o.lane*90;
   ctx.fillStyle=mode==="car"?"#ff5577":"#ffd166";
   ctx.fillRect(x-15,o.y-18,30,36);
  });
  let x=90+player.lane*90;
  ctx.fillStyle="#36e0d0";
  if(mode==="car"){
   ctx.fillRect(x-17,player.y-25,34,50);
   ctx.fillStyle="#bcefff";ctx.fillRect(x-11,player.y-15,22,12);
  }else{
   let y=player.y-(player.jump>0?player.jump*5:0);
   ctx.fillRect(x-12,y-20,24,35);
   ctx.fillStyle="#ffd2a6";ctx.fillRect(x-10,y-32,20,15);
   if(player.slide>0)ctx.fillRect(x-22,y,44,12);
  }
 }
}

reset();
</script>
</body>
</html>
